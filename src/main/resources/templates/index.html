<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmoteka</title>
    <link rel="stylesheet" th:href="@{/style/style.css}">
    <script>
        // Ustaw handler przed załadowaniem SDK — wymagane przez Google Cast SDK
        window['__onGCastApiAvailable'] = function(isLoaded) {
            if (isLoaded) {
                window.__castSdkReady();
            } else {
                alert('Google Cast nie jest wspierany w tej przeglądarce. Użyj Chrome lub Edge.');
            }
        };
    </script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">FILMOTeka</div>
        <div class="navbar-search">
            <input type="text" id="searchInput" class="search-input" placeholder="Szukaj filmów...">
            <button type="button" id="sortBtn" class="sort-btn" title="Sortuj po tytule (A→Z / Z→A)">⇅</button>
        </div>
        <nav class="navbar-nav">
            <a th:href="@{/add}" class="nav-button">+ Dodaj film</a>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">Oglądaj teraz</h1>

        <div class="genre-filters" id="genreFilters"></div>

        <div class="movie-grid">
            <div class="movie-card" th:each="film : ${filmy}" th:data-id="${film.id}" th:data-title="${film.title}">
                <div class="card-actions">
                    <a class="action-btn edit-btn" th:href="@{'/edit/' + ${film.id}}" title="Edytuj film">✎</a>
                    <button class="action-btn delete-btn" title="Usuń film">✕</button>
                    <button class="action-btn cast-btn" th:if="${film.videoUrl != null}" th:data-video-url="${film.videoUrl}" title="Prześlij na Chromecast">📺</button>
                    <button class="action-btn streaming-btn" th:data-film-id="${film.id}" title="Szukaj w serwisach streamingowych">📡</button>
                </div>
                <div class="movie-poster">
                    <img th:src="${film.posterUrl}" th:alt="${film.title}" loading="lazy"/>
                    <div class="movie-overlay">
                        <p th:text="${film.description}"></p>
                    </div>
                    <a class="play-btn" th:href="${film.videoUrl}" th:title="'Odtwórz: ' + ${film.title}" th:if="${film.videoUrl != null}">▶</a>
                </div>
                <div class="movie-info">
                    <h3 class="movie-title" th:text="${film.title}"></h3>
                    <div class="movie-meta">
                        <span class="movie-year" th:text="${film.year}"></span>
                        <span class="movie-genre" th:text="${film.genre}"></span>
                    </div>
                    <p class="movie-director" th:text="'Reżyser: ' + ${film.director}"></p>
                    <div class="streaming-icons" th:data-film-id="${film.id}"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const grid = document.querySelector('.movie-grid');
        let sortAsc = true; // domyślnie A→Z
        let activeGenre = 'all'; // filtr gatunku: 'all' = wszystkie
        let activeVideoFilter = 'all'; // filtr wideo: 'all' = wszystkie, 'with' = z plikiem

        // Pobierz unikalne gatunki (pojedyncze) i wygeneruj przyciski filtrów
        (function() {
            const genres = new Set();
            document.querySelectorAll('.movie-card').forEach(card => {
                const genreText = card.querySelector('.movie-genre')?.textContent.trim();
                if (genreText) {
                    // Rozdziel gatunki po przecinku: "Komedia, Sensacyjny" → ["Komedia", "Sensacyjny"]
                    genreText.split(',').forEach(g => {
                        const trimmed = g.trim();
                        if (trimmed) genres.add(trimmed);
                    });
                }
            });
            const filtersDiv = document.getElementById('genreFilters');
            const allBtn = document.createElement('button');
            allBtn.type = 'button';
            allBtn.className = 'genre-btn active';
            allBtn.textContent = 'Wszystkie';
            allBtn.dataset.genre = 'all';
            filtersDiv.appendChild(allBtn);
            Array.from(genres).sort((a, b) => a.localeCompare(b, 'pl')).forEach(genre => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'genre-btn';
                btn.textContent = genre;
                btn.dataset.genre = genre;
                filtersDiv.appendChild(btn);
            });
            filtersDiv.addEventListener('click', function(e) {
                const btn = e.target.closest('.genre-btn');
                if (!btn) return;
                // Ignoruj przycisk filtru wideo — ma własny handler
                if (btn.classList.contains('video-filter-btn')) return;
                this.querySelectorAll('.genre-btn:not(.video-filter-btn)').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeGenre = btn.dataset.genre;
                applyFilters();
            });
        })();

        // Przycisk filtru "Z plikiem wideo"
        (function() {
            const filtersDiv = document.getElementById('genreFilters');
            const videoBtn = document.createElement('button');
            videoBtn.type = 'button';
            videoBtn.className = 'genre-btn video-filter-btn';
            videoBtn.textContent = '▶ Z plikiem wideo';
            videoBtn.dataset.filter = 'video';
            filtersDiv.appendChild(videoBtn);
            videoBtn.addEventListener('click', function() {
                if (activeVideoFilter === 'all') {
                    activeVideoFilter = 'with';
                    this.classList.add('active');
                } else {
                    activeVideoFilter = 'all';
                    this.classList.remove('active');
                }
                applyFilters();
            });
        })();

        // Zastosuj filtry: gatunek + wideo + wyszukiwarka
        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            document.querySelectorAll('.movie-card').forEach(card => {
                const title = card.querySelector('.movie-title')?.textContent.toLowerCase() || '';
                const director = card.querySelector('.movie-director')?.textContent.toLowerCase() || '';
                const genreText = card.querySelector('.movie-genre')?.textContent.trim() || '';
                const genre = genreText.toLowerCase();
                const year = card.querySelector('.movie-year')?.textContent.toLowerCase() || '';
                // Sprawdzamy czy którykolwiek z pojedynczych gatunków karty pasuje do aktywnego filtru
                const cardGenres = genreText.split(',').map(g => g.trim());
                const genreMatch = activeGenre === 'all' || cardGenres.includes(activeGenre);
                // Filtr wideo: czy karta ma przycisk odtwarzania (▶)
                const hasVideo = card.querySelector('.play-btn') !== null;
                const videoMatch = activeVideoFilter === 'all' || hasVideo;
                const searchMatch = !query || title.includes(query) || director.includes(query) || genre.includes(query) || year.includes(query);
                card.style.display = (genreMatch && videoMatch && searchMatch) ? '' : 'none';
            });
        }

        // Domyślne sortowanie alfabetyczne przy załadowaniu strony
        (function() {
            const cards = Array.from(grid.querySelectorAll('.movie-card'));
            cards.sort((a, b) => {
                const titleA = a.querySelector('.movie-title')?.textContent || '';
                const titleB = b.querySelector('.movie-title')?.textContent || '';
                return titleA.localeCompare(titleB, 'pl');
            });
            cards.forEach(card => grid.appendChild(card));
        })();

        // Po domyślnym sortowaniu A→Z, ustaw sortAsc=false,
        // żeby pierwsze kliknięcie przycisku zastosowało sortowanie odwrotne (Z→A).
        sortAsc = false;

        document.getElementById('searchInput').addEventListener('input', function() {
            applyFilters();
        });

        document.getElementById('sortBtn').addEventListener('click', function() {
            const cards = Array.from(grid.querySelectorAll('.movie-card'));
            cards.sort((a, b) => {
                const titleA = a.querySelector('.movie-title')?.textContent || '';
                const titleB = b.querySelector('.movie-title')?.textContent || '';
                return sortAsc
                    ? titleA.localeCompare(titleB, 'pl')
                    : titleB.localeCompare(titleA, 'pl');
            });
            cards.forEach(card => grid.appendChild(card));
            sortAsc = !sortAsc;
            this.title = sortAsc ? 'Sortuj po tytule (A→Z)' : 'Sortuj po tytule (Z→A)';
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const card = this.closest('.movie-card');
                const id = card.dataset.id;
                const title = card.dataset.title;
                if (confirm('Czy na pewno chcesz usunąć film: "' + title + '"?')) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/delete/' + id;
                    document.body.appendChild(form);
                    form.submit();
                }
            });
        });

        // ── Streaming services (TMDb) ──
        (function() {
            document.querySelectorAll('.streaming-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const filmId = this.dataset.filmId;
                    const card = this.closest('.movie-card');
                    const container = card.querySelector('.streaming-icons');
                    if (!container) return;

                    // Sprawdź czy już załadowane
                    if (container.dataset.loaded === 'true') return;

                    // Pokaż spinner
                    container.innerHTML = '<div class="streaming-loading">⏳</div>';

                    fetch('/api/streaming/' + filmId)
                        .then(response => response.json())
                        .then(providers => {
                            container.dataset.loaded = 'true';
                            container.innerHTML = '';
                            if (!providers || providers.length === 0) {
                                container.innerHTML = '<p class="streaming-empty">Brak dostępnych serwisów w Polsce</p>';
                                return;
                            }
                            providers.forEach(provider => {
                                const img = document.createElement('img');
                                if (provider.logoPath) {
                                    img.src = 'https://image.tmdb.org/t/p/w500' + provider.logoPath;
                                } else {
                                    img.src = '';
                                }
                                img.alt = provider.providerName;
                                img.title = provider.providerName;
                                img.className = 'streaming-icon';
                                img.loading = 'lazy';
                                container.appendChild(img);
                            });
                        })
                        .catch(error => {
                            console.error('Błąd pobierania serwisów streamingowych:', error);
                            container.innerHTML = '<p class="streaming-empty">Nie udało się pobrać danych</p>';
                        });
                });
            });
        })();

        // ── Touch toggle for action buttons on mobile ──
        (function() {
            if ('ontouchstart' in window) {
                document.querySelectorAll('.movie-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        // Jeśli kliknięto przycisk akcji, nie przełączaj klasy
                        if (e.target.closest('.action-btn') || e.target.closest('.play-btn')) return;
                        // Usuń klasę .touched ze wszystkich kart
                        document.querySelectorAll('.movie-card.touched').forEach(c => {
                            if (c !== this) c.classList.remove('touched');
                        });
                        // Przełącz klasę .touched na klikniętej karcie
                        this.classList.toggle('touched');
                    });
                });
                // Usuń klasę .touched po kliknięciu poza kartę
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.movie-card')) {
                        document.querySelectorAll('.movie-card.touched').forEach(card => {
                            card.classList.remove('touched');
                        });
                    }
                });
            }
        })();

        // ── Chromecast ──
        (function() {
            let castContext;
            let isCasting = false;

            function initCast() {
                castContext = cast.framework.CastContext.getInstance();

                const castOptions = new cast.framework.CastOptions();
                castOptions.receiverApplicationId = chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID;
                castOptions.autoJoinPolicy = chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED;
                castContext.setOptions(castOptions);

                // Observer stanu połączenia
                castContext.addEventListener(
                    cast.framework.CastContextEventType.CAST_STATE_CHANGED,
                    function(event) {
                        const buttons = document.querySelectorAll('.cast-btn');
                        buttons.forEach(btn => {
                            if (event.castState === cast.framework.CastState.NO_DEVICES_AVAILABLE) {
                                btn.disabled = true;
                                btn.title = 'Chromecast nie wykryty';
                            } else {
                                btn.disabled = false;
                                btn.title = 'Prześlij na telewizor';
                            }
                        });
                    }
                );

                // Observer stanu sesji — wykrywa istniejącą sesję po odświeżeniu strony
                castContext.addEventListener(
                    cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
                    function(event) {
                        if (event.sessionState === cast.framework.SessionState.CONNECTED) {
                            console.log('Istniejąca sesja Chromecast wykryta:', event.session.sessionId);
                        }
                    }
                );

                // Handler dla przycisków cast
                document.querySelectorAll('.cast-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const videoUrl = this.dataset.videoUrl;
                        if (!videoUrl) return;

                        const fullUrl = window.location.origin + videoUrl;
                        const card = this.closest('.movie-card');
                        const title = card.querySelector('.movie-title')?.textContent || '';

                        // Sprawdź czy jest już aktywna sesja
                        const session = castContext.getCurrentSession();
                        if (session) {
                            loadMedia(session, fullUrl, title);
                            return;
                        }

                        // Poproś użytkownika o wybór urządzenia
                        castContext.requestSession()
                            .then(function() {
                                const session = castContext.getCurrentSession();
                                if (session) {
                                    loadMedia(session, fullUrl, title);
                                } else {
                                    alert('Nie udało się utworzyć sesji Chromecast.');
                                }
                            })
                            .catch(function(error) {
                                if (error.code !== 'CANCEL') {
                                    alert('Błąd Chromecast: ' + JSON.stringify(error));
                                }
                            });
                    });
                });
            }

            // Wczytaj media na wybranym urządzeniu
            function loadMedia(session, fullUrl, title) {
                const mediaInfo = new cast.framework.messages.MediaInfo();
                mediaInfo.contentId = fullUrl;
                mediaInfo.contentType = 'video/mp4';
                mediaInfo.metadata = new cast.framework.messages.MovieMetadata();
                mediaInfo.metadata.title = title;

                const request = new cast.framework.messages.LoadRequest();
                request.media = mediaInfo;

                session.loadMedia(request)
                    .then(function() {
                        isCasting = true;
                    })
                    .catch(function(error) {
                        alert('Nie udało się przesłać filmu na telewizor.\nBłąd: ' + JSON.stringify(error));
                    });
            }

            // Funkcja wywoływana przez handler __onGCastApiAvailable z <head>
            window.__castSdkReady = function() {
                initCast();
            };
        })();

    </script>

</body>
</html>
